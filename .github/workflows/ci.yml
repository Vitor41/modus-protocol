name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879
        with:
          version: 11.19.0
          runtime: node@22.13
          cache: true
          cache-dependency-path: runtime/pnpm-lock.yaml
          install: false

      - name: Install dependencies
        working-directory: runtime
        run: pnpm install --frozen-lockfile

      - name: Test contracts and runtime
        working-directory: runtime
        run: pnpm test

      - name: Build plugin
        working-directory: runtime
        run: pnpm run build:plugin
