name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: runtime
        run: corepack pnpm install --frozen-lockfile

      - name: Test contracts and runtime
        working-directory: runtime
        run: corepack pnpm test

      - name: Build plugin
        working-directory: runtime
        run: corepack pnpm run build:plugin
