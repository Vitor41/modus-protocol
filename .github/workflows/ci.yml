name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0609f0983b7a228f052f81ef4c3d6510cae254ad
        with:
          version: 11.19.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13"
          cache: pnpm
          cache-dependency-path: runtime/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: runtime
        run: pnpm install --frozen-lockfile

      - name: Test contracts and runtime
        working-directory: runtime
        run: pnpm test

      - name: Build plugin
        working-directory: runtime
        run: pnpm run build:plugin
